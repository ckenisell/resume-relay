name: Docker image

# Publishes ghcr.io/ckenisell/resume-relay for a release. The image wraps that release's own Linux
# download (the same program, byte for byte), is tested against the simulated players first, and is
# built for amd64 and arm64 NAS models.
#
# Runs automatically after every release (called from build.yml). Run it by hand to add the image to
# a release that already exists:  gh workflow run docker.yml -f release=v0.3.1
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to package (e.g. v0.3.1)"
        required: true
      update_notes:
        description: "Also rewrite that release's notes from docs/release-notes"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: string
        required: true
      update_notes:
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.release }}
  IMAGE: ghcr.io/ckenisell/resume-relay

jobs:
  image:
    name: Build, test and publish the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get this release's Linux download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ctx
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*linux.tar.gz' --dir ctx
          tar -xzf ctx/*.tar.gz -C ctx
          cp packaging/docker/Dockerfile ctx/resume-relay/
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          # Test with the simulator and checks that shipped with this release.
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout "$TAG" -- test/

      - name: Build the image for testing
        run: docker build --build-arg VERSION="$VERSION" -t resume-relay:test ctx/resume-relay

      - name: End-to-end tests against the container
        run: |
          python3 -I test/mock_zidoo.py > /tmp/mock.log 2>&1 &
          sleep 1
          mkdir -p /tmp/rr-docker-data
          docker run -d --name rr --network host \
            -e RESUMERELAY_SCAN_EXTRA=127.0.0 -e RESUMERELAY_WOL_PORTS=40009 -e RESUMERELAY_PLEXTV=http://127.0.0.7:32400 -e RESUMERELAY_UPDATE_API=http://127.0.0.7:32400 -e RESUMERELAY_CATCHUP_DELAY=3 \
            -v /tmp/rr-docker-data:/data resume-relay:test
          for i in $(seq 1 30); do curl -fsS localhost:8090/api/state >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -X POST localhost:8090/api/scan
          python3 -I test/run_tests.py
          # Settings must land in the mapped folder, or they would be lost on every update.
          test -s /tmp/rr-docker-data/devices.json
          ls -la /tmp/rr-docker-data

      - name: Container log (on failure)
        if: failure()
        run: docker logs rr || true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish (amd64 + arm64)
        run: |
          # Test builds (v0.3.1-beta.1) get only their own tag; full releases also become "latest".
          TAGS=(-t "$IMAGE:$VERSION")
          [[ "$TAG" == *-* ]] || TAGS+=(-t "$IMAGE:latest")
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" \
            "${TAGS[@]}" --push ctx/resume-relay

  notes:
    name: Refresh the release notes
    if: inputs.update_notes
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite notes from docs/release-notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/${TAG%%-*}.md"
          test -f "$NOTES"
          cat docs/release-notes/_header.md "$NOTES" docs/release-notes/_footer.md > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
