name: Build

# Every push: build and test the Linux edition, build the Windows app.
# A tag like v0.2.0: also publish both as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. v0.2.0 or v0.2.0-beta.1). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

# The release tag being built (v0.3.1-beta.1), or empty for an ordinary build.
env:
  RELEASE_TAG: ${{ inputs.release != '' && inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  linux:
    name: Linux edition (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Resume Relay runs on .NET 8; the Apple TV library (third_party) is C# 13, which needs the .NET 10 SDK to build.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build package
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}   # built into the program (Live Poster posters); never shown
        run: |
          # Label: the release tag without its "v" (0.3.1-beta.1), or "<version>-dev" for an ordinary build.
          V="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          export RR_VERSION="${RELEASE_TAG#v}"; [[ -n "$RR_VERSION" ]] || RR_VERSION="$V-dev"
          packaging/linux/package.sh artifacts
          tar -xzOf artifacts/*.tar.gz resume-relay/README.md | head -1

      - name: ffmpeg (Live Poster makes its videos with it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: End-to-end tests against simulated Zidoo players
        run: |
          mkdir -p /tmp/rr && tar -xzf artifacts/resume-relay-*-linux.tar.gz -C /tmp/rr
          python3 -I test/mock_zidoo.py > /tmp/mock.log 2>&1 &
          sleep 1
          RESUMERELAY_DATA=/tmp/rr-data RESUMERELAY_SCAN_EXTRA=127.0.0 RESUMERELAY_PORT=8090 RESUMERELAY_WOL_PORTS=40009 RESUMERELAY_PLEXTV=http://127.0.0.7:32400 RESUMERELAY_UPDATE_API=http://127.0.0.7:32400 RESUMERELAY_CATCHUP_DELAY=3 RESUMERELAY_WATCHSYNC_DELAY=5 RESUMERELAY_JELLYFIN_DISCOVER=127.0.0.8 RESUMERELAY_ENCODER=libx264 \
          RESUMERELAY_APPLETV_MOCK=http://127.0.0.10:8080 RESUMERELAY_TMDB_API=http://127.0.0.11:8080/3 RESUMERELAY_TMDB_IMAGES=http://127.0.0.11:8080/t/p/original RESUMERELAY_TMDB_KEY=test-key \
            dotnet /tmp/rr/resume-relay/app/ResumeRelay.dll > /tmp/relay.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8090/api/state >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -X POST localhost:8090/api/scan
          set -o pipefail
          python3 -I test/run_tests.py 2>&1 | tee /tmp/tests.log || { grep -E "^FAIL|Traceback|Error" /tmp/tests.log | head -20 | sed "s/^/::error::/"; exit 1; }

      - name: Relay log (on failure)
        if: failure()
        run: cat /tmp/relay.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*.tar.gz

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Resume Relay runs on .NET 8; the Apple TV library (third_party) is C# 13, which needs the .NET 10 SDK to build.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish ResumeRelay.exe
        shell: pwsh
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { "$version-dev" }
          dotnet publish src/ResumeRelay.Windows/ResumeRelay.Windows.csproj -c Release -o publish "-p:InformationalVersion=$version"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item publish/ResumeRelay.exe "artifacts/ResumeRelay-$version-windows.exe"
          Get-ChildItem artifacts | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*.exe

  android:
    name: Screen apps (Android and Roku)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.13"
      - name: Check the Roku app (BrightScript compiler)
        run: npx -y brighterscript@0.65.27 --rootDir apps/roku --createPackage false --copyToStaging false

      - name: Build the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          export RR_VERSION="${RELEASE_TAG#v}"; [[ -n "$RR_VERSION" ]] || RR_VERSION="$V-dev"
          # Signed with the project's key when it's set up (repository secrets), so updates install over each other.
          if [[ -n "$KS_B64" ]]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rr.jks"; export RR_KEYSTORE="$RUNNER_TEMP/rr.jks" RR_KEYSTORE_PASSWORD="$KS_PW"; fi
          # The build's errors are repeated as annotations (readable on the run's summary page).
          if ! gradle -p apps/android --no-daemon assembleRelease bundleRelease > "$RUNNER_TEMP/gradle.log" 2>&1; then
            grep -E "^e: |^ERROR|error:|AAPT|Execution failed|What went wrong" -A2 "$RUNNER_TEMP/gradle.log" | grep -v "^--$" | head -9 | while IFS= read -r l; do echo "::error::${l}"; done
            tail -60 "$RUNNER_TEMP/gradle.log"; exit 1
          fi
          mkdir -p artifacts
          cp apps/android/app/build/outputs/apk/release/app-release.apk "artifacts/ResumeRelay-Screen-$RR_VERSION-android.apk"
          # Google Play takes an app bundle (.aab), signed with the same key (Play then signs what it hands out).
          cp apps/android/app/build/outputs/bundle/release/app-release.aab "artifacts/ResumeRelay-Screen-$RR_VERSION-android.aab"
          # Which key signed it (on the run's summary page): the project's own key, or the throwaway debug key.
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          CERT="$("$SIGNER" verify --print-certs "artifacts/ResumeRelay-Screen-$RR_VERSION-android.apk" 2>/dev/null | grep -E "certificate DN|SHA-256" | head -2 | tr '\n' ' ')"
          if [[ -n "$KS_B64" ]]; then echo "::notice::Signed with the project key: $CERT"; else echo "::warning::Signed with the debug key (no ANDROID_KEYSTORE_B64 secret): $CERT"; fi
          # The Roku app is a zip of its folder (installed from the Roku's developer page until it's in the Roku store).
          # Major and minor come from the version (0.8.0-beta.2 → 0, 8); the build number counts up with every run, so
          # each package is newer than the last (Roku compares major.minor.build).
          RK_MAJOR=$(echo "$RR_VERSION" | cut -d. -f1); RK_MINOR=$(echo "$RR_VERSION" | cut -d. -f2)
          (cd apps/roku && sed -i -e "s/^major_version=.*/major_version=${RK_MAJOR}/" -e "s/^minor_version=.*/minor_version=${RK_MINOR}/" -e "s/^build_version=.*/build_version=${GITHUB_RUN_NUMBER}/" manifest && zip -qr "$GITHUB_WORKSPACE/artifacts/ResumeRelay-Screen-$RR_VERSION-roku.zip" manifest source components images)
          ls -la artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/*.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v0.2.0-beta.1) are test builds: publish them as pre-releases.
          PRE=""; [[ "$TAG" == *-* ]] && PRE="--prerelease"
          # Hand-written notes for this version if they exist, otherwise GitHub's list of changes.
          # Every release starts with the shared intro (_header.md) and ends with Special Thanks (_footer.md).
          NOTES="docs/release-notes/${TAG%%-*}.md"
          if [[ -f "$NOTES" ]]; then
            cat docs/release-notes/_header.md "$NOTES" docs/release-notes/_footer.md > "$RUNNER_TEMP/notes.md"
            NOTES_ARGS=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            cat docs/release-notes/_header.md docs/release-notes/_footer.md > "$RUNNER_TEMP/notes.md"
            NOTES_ARGS=(--generate-notes --notes-file "$RUNNER_TEMP/notes.md")
          fi
          # Creates the tag on the built commit if it doesn't exist yet.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Resume Relay ${TAG#v}" "${NOTES_ARGS[@]}" $PRE

      - name: Announce on Discord
        # Posts the release's notes to the Discord channel whose webhook is in the DISCORD_WEBHOOK_URL secret (betas
        # too). Without the secret this does nothing; a Discord problem never fails the release.
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [[ -n "$HOOK" ]] || { echo "No Discord webhook set up: skipped."; exit 0; }
          python3 - <<'PY' > "$RUNNER_TEMP/discord.json"
          import json, os, re
          tag = os.environ["TAG"]; beta = "-" in tag
          path = f"docs/release-notes/{tag.split('-')[0]}.md"
          text = open(path, encoding="utf-8").read() if os.path.exists(path) else ""
          # Discord shows no tables: the Downloads section (a table) is left out; the link below has the files.
          text = re.sub(r"(?ms)^## Downloads\n.*?(?=^## |\Z)", "", text)
          text = re.sub(r"(?m)^#{1,3} (.+)$", r"**\1**", text).strip()
          # The notes are wrapped for reading on GitHub; Discord keeps every line break, so wrapped lines are joined.
          out = []
          for line in text.split("\n"):
              t = line.strip()
              head = t.startswith(("- ", "* ", "|")) or re.match(r"^\d+\. ", t) or (t.startswith("**") and t.endswith("**"))
              if t and out and out[-1].strip() and not head and not (out[-1].strip().startswith("**") and out[-1].strip().endswith("**")):
                  out[-1] = out[-1].rstrip() + " " + t
              else:
                  out.append(line.rstrip())
          text = "\n".join(out)
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}"
          more = f"\n\n[Read the full notes and download it on GitHub]({url})"
          if len(text) + len(more) > 4000:
              text = text[: 4000 - len(more) - 2].rsplit("\n", 1)[0] + "\n…"
          print(json.dumps({
              "username": "Resume Relay",
              "embeds": [{
                  "title": f"Resume Relay {tag.lstrip('v')}" + (" (beta)" if beta else ""),
                  "url": url,
                  "description": text + more,
                  "color": 0x9C99B5 if beta else 0xF2B44A,
                  "footer": {"text": "Beta: for testing; things may change before the full release." if beta else "Full release"},
              }],
          }))
          PY
          code=$(curl -s -o "$RUNNER_TEMP/discord.out" -w '%{http_code}' -H "Content-Type: application/json" -X POST --data @"$RUNNER_TEMP/discord.json" "$HOOK") || code=0
          if [[ "$code" == 2* ]]; then echo "Posted to Discord."; else echo "::warning::Discord didn't take the post ($code): $(head -c 300 "$RUNNER_TEMP/discord.out")"; fi

  docker:
    name: Docker image
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: release
    uses: ./.github/workflows/docker.yml
    with:
      release: ${{ inputs.release != '' && inputs.release || github.ref_name }}
